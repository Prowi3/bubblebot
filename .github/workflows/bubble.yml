        run: python3 src/main.py
name: Bubble

on:
  # starts on every push on main branch
  push:
    branches: [ "main" ]

  # starts automatically every 5 hours
  schedule:
    - cron: '0 */5 * * *'

  # enable manual startup
  workflow_dispatch:

# checks if there's any host already running and kills it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{secrets.TOKEN}}
      SPOTID: ${{secrets.SPOTID}}
      SPOTSEC: ${{secrets.SPOTSEC}}
      GIT: ${{secrets.GIT}}
      GLSEARCH: ${{secrets.GLSEARCH}}
      GPTKEY: ${{secrets.GPTKEY}}
      IMAGINE: ${{secrets.IMAGINE}}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Starting Bubble
        run: python3 src/main.py